name: Build Server JAR

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      skipHandbook:
        description: 'Skip handbook generation'
        required: false
        default: 'false'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Make gradlew executable
        run: chmod +x gradlew
        
      - name: Build JAR
        run: |
          if [ "${{ github.event.inputs.skipHandbook }}" = "true" ]; then
            ./gradlew jar -PskipHandbook=1
          else
            ./gradlew jar
          fi
          
      - name: Generate handbook (if not skipped)
        if: github.event.inputs.skipHandbook != 'true'
        run: |
          ./gradlew generateHandbook || echo "Handbook generation skipped or failed"
        continue-on-error: true
        
      - name: List generated JAR files
        run: |
          echo "Looking for JAR files..."
          find . -name "*.jar" -not -name "gradle-wrapper.jar" -type f
          
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-jar
          path: |
            **/build/libs/*.jar
            *.jar
          retention-days: 30
